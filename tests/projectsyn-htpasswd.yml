applications:
  - espejote
  - external-secrets-operator

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-espejote/master/lib/espejote.libsonnet
        output_path: vendor/lib/espejote.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-external-secrets-operator/master/lib/external-secrets-operator.libsonnet
        output_path: vendor/lib/external-secrets-operator.libsonnet


  registry_cache:
    projectsynHtpasswd:
      enabled: true
      lieutenantInstances:
        lieutenant-prod:
          kubernetesUrl: https://syn.example.com
          token: ?{vaultkv:${cluster:tenant}/${cluster:name}/registry-cache/token_syn-example-com}
        lieutenant-int:
          kubernetesUrl: https://syn-int.example.com
          token: ?{vaultkv:${cluster:tenant}/${cluster:name}/registry-cache/token_syn-int-example-com}
          userPrefix: int_
          lieutenantNamespace: lieutenant-int
