apiVersion: v1
data: {}
kind: Secret
metadata:
  annotations: {}
  labels:
    name: projectsyn-htpasswd-lieutenant-tokens
  name: projectsyn-htpasswd-lieutenant-tokens
  namespace: syn-registry-cache
stringData:
  lieutenant-int: t-silent-test-1234/c-green-test-1234/registry-cache/token_syn-int-example-com
  lieutenant-prod: t-silent-test-1234/c-green-test-1234/registry-cache/token_syn-example-com
type: Opaque
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    name: lieutenant-int
  name: lieutenant-int
  namespace: syn-registry-cache
spec:
  provider:
    kubernetes:
      auth:
        token:
          bearerToken:
            key: lieutenant-int
            name: projectsyn-htpasswd-lieutenant-tokens
      remoteNamespace: lieutenant-int
      server:
        url: https://syn-int.example.com
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    name: lieutenant-prod
  name: lieutenant-prod
  namespace: syn-registry-cache
spec:
  provider:
    kubernetes:
      auth:
        token:
          bearerToken:
            key: lieutenant-prod
            name: projectsyn-htpasswd-lieutenant-tokens
      remoteNamespace: lieutenant
      server:
        url: https://syn.example.com
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    name: projectsyn-htpasswd-cluster-tokens
  name: projectsyn-htpasswd-cluster-tokens
  namespace: syn-registry-cache
spec:
  dataFrom:
    - find:
        conversionStrategy: Default
        decodingStrategy: None
        name:
          regexp: ^c-.*
      rewrite:
        - regexp:
            source: (.*)
            target: int_$1
      sourceRef:
        storeRef:
          kind: SecretStore
          name: lieutenant-int
    - find:
        conversionStrategy: Default
        decodingStrategy: None
        name:
          regexp: ^c-.*
      sourceRef:
        storeRef:
          kind: SecretStore
          name: lieutenant-prod
  refreshInterval: 1h
  target:
    name: projectsyn-htpasswd-client-tokens
    template:
      engineVersion: v2
      templateFrom:
        - literal: |
            {{- $htpasswd := list }}
            {{- range $key, $val := . }}
            {{- $json := $val | fromJson }}
            {{- $isClusterToken := (and ((hasSuffix "-api-token" $key) | not) ((contains "-token-" $key) |not)) }}
            {{- if $isClusterToken }}
            {{ $key }}: {{ $json.token | sha256sum }}
            {{- end }}
            {{- end }}
          target: Data
          valuesDecodingStrategy: None
---
apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: projectsyn-htpasswd
  name: projectsyn-htpasswd
  namespace: syn-registry-cache
spec:
  applyOptions:
    force: true
  context:
    - name: token_secrets
      resource:
        apiVersion: v1
        kind: Secret
        name: projectsyn-htpasswd-client-tokens
        namespace: syn-registry-cache
  serviceAccountRef:
    name: projectsyn-htpasswd-manager
  template: |
    local esp = import 'espejote.libsonnet';

    local config = import 'projectsyn-htpasswd/config.json';

    local token_secrets = esp.context().token_secrets;

    local bcrypt(password, salt) =
      local h = esp.ALPHA.bcrypt(password, salt);
      if h[1] != null then
        error 'Error in Espejote bcrypt() native function: %s' % h[1]
      else
        h[0];

    local cluster_passwords = std.foldl(
      function(tokens, secret)
        local new_tokens = std.foldl(
          function(ts, cluster)
            if std.objectHas(tokens, cluster) then
              error "Duplicate username '%s'" % cluster
            else
              ts {
                [cluster]: std.base64Decode(secret.data[cluster]),
              },
          std.objectFields(secret.data),
          {}
        );
        tokens + new_tokens,
      token_secrets,
      {}
    );

    local htpasswd_entries = [
      '%(cluster)s:%(pw_bcrypt)s' % {
        cluster: cluster_key,
        pw_bcrypt: bcrypt(
          cluster_passwords[cluster_key],
          std.sha256(cluster_key)[-16:]
        ),
      }
      for cluster_key in std.objectFields(cluster_passwords)
    ];

    local htpasswd_secret = {
      apiVersion: 'v1',
      kind: 'Secret',
      type: 'Opaque',
      metadata: {
        name: config.secretName,
      },
      stringData: {
        htpasswd: std.join('\n', htpasswd_entries) + '\n',
      },
    };

    [
      htpasswd_secret,
      {
        apiVersion: 'apps/v1',
        kind: 'Deployment',
        metadata: {
          name: 'registry',
        },
        spec: {
          template: {
            metadata: {
              annotations: {
                ['%s/checksum' % config.secretName]: std.sha256(std.manifestJsonMinified(htpasswd_secret)),
              },
            },
          },
        },
      },
    ]
  triggers:
    - name: config
      watchResource:
        apiVersion: espejote.io/v1alpha1
        kind: JsonnetLibrary
        name: projectsyn-htpasswd
        namespace: syn-registry-cache
    - name: htpasswd_secret
      watchResource:
        apiVersion: v1
        kind: Secret
        name: projectsyn-htpasswd
        namespace: syn-registry-cache
    - name: token_secret
      watchContextResource:
        name: token_secrets
---
apiVersion: espejote.io/v1alpha1
kind: JsonnetLibrary
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: projectsyn-htpasswd
  name: projectsyn-htpasswd
  namespace: syn-registry-cache
spec:
  data:
    config.json: '{"secretName":"projectsyn-htpasswd"}'
---
