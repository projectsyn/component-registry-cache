apiVersion: v1
data: {}
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: syn
  name: registry-config
  namespace: syn-registry-cache
stringData:
  config.yml: |-
    "auth":
      "htpasswd":
        "path": "/etc/distribution-htpasswd/htpasswd"
        "realm": "docker-registry-realm"
    "http":
      "addr": "0.0.0.0:5000"
      "debug":
        "addr": "0.0.0.0:6000"
        "prometheus":
          "enabled": true
          "path": "/metrics"
      "host": "https://dockerhub.example.com"
      "secret": "t-silent-test-1234/c-green-test-1234/registry-cache/http_secret"
    "proxy":
      "remoteurl": "https://registry-1.docker.io"
    "redis":
      "addrs":
      - "redis:6379"
    "storage":
      "cache":
        "blobdescriptor": "redis"
      "delete":
        "enabled": true
      "s3":
        "accesskey": "t-silent-test-1234/c-green-test-1234/registry-cache/s3_accesskey"
        "bucket": "t-silent-test-1234-c-green-test-1234-registry-mirror-data"
        "region": "eu-central-1"
        "regionendpoint": "https://objects.rma.cloudscale.ch"
        "secretkey": "t-silent-test-1234/c-green-test-1234/registry-cache/s3_secretkey"
    "version": "0.1"
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checksum/config: 99914b932bd37a50b983c5e7c90ae93b
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: syn
  name: registry
  namespace: syn-registry-cache
spec:
  minReadySeconds: 30
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: registry
      app.kubernetes.io/managed-by: commodore
      app.kubernetes.io/name: registry-cache
      app.kubernetes.io/part-of: syn
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/component: registry
        app.kubernetes.io/managed-by: commodore
        app.kubernetes.io/name: registry-cache
        app.kubernetes.io/part-of: syn
    spec:
      containers:
        - args:
            - serve
            - /run/distribution/config.yml
          env: []
          image: docker.io/library/registry:3.1.2
          imagePullPolicy: IfNotPresent
          name: registry
          ports:
            - containerPort: 5000
              name: http
            - containerPort: 6000
              name: metrics
          resources:
            limits:
              cpu: 200m
              memory: 400Mi
            requests:
              cpu: 100m
              memory: 200Mi
          stdin: false
          tty: false
          volumeMounts:
            - mountPath: /etc/distribution
              name: config
            - mountPath: /etc/distribution-htpasswd
              name: external-htpasswd
            - mountPath: /run/distribution
              name: runconfig
      imagePullSecrets:
        - name: registry-pull-secret
      initContainers:
        - args: []
          command:
            - sh
            - -c
            - |
              yq \
                '.proxy.username=strenv(PROXY_USERNAME)|.proxy.password=strenv(PROXY_PASSWORD)' \
                /etc/distribution/config.yml > /run/distribution/config.yml
          env:
            - name: PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: proxy_password
                  name: registry-config-secrets
            - name: PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  key: proxy_username
                  name: registry-config-secrets
          image: quay.io/appuio/oc:v4.21
          imagePullPolicy: IfNotPresent
          name: render-config
          ports: []
          stdin: false
          tty: false
          volumeMounts:
            - mountPath: /etc/distribution
              name: config
            - mountPath: /run/distribution
              name: runconfig
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          secret:
            secretName: registry-config
        - name: external-htpasswd
          secret:
            secretName: external-htpasswd
        - emptyDir:
            medium: Memory
          name: runconfig
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: syn
  name: registry
  namespace: syn-registry-cache
spec:
  ports:
    - name: http
      port: 5000
    - name: metrics
      port: 6000
  selector:
    app.kubernetes.io/component: registry
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: syn
  name: registry-cache
  namespace: syn-registry-cache
spec:
  endpoints:
    - interval: 60s
      path: /metrics
      port: metrics
      scrapeTimeout: 30s
  jobLabel: registry-cache
  namespaceSelector:
    matchNames:
      - syn-registry-cache
  selector:
    matchLabels:
      app.kubernetes.io/component: registry
      app.kubernetes.io/managed-by: commodore
      app.kubernetes.io/name: registry-cache
      app.kubernetes.io/part-of: syn
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: registry-cache
    app.kubernetes.io/part-of: syn
  name: registry
  namespace: syn-registry-cache
spec:
  rules:
    - host: dockerhub.example.com
      http:
        paths:
          - backend:
              service:
                name: registry
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - dockerhub.example.com
      secretName: registry-tls
